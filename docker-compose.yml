# Arranque en cualquier equipo que tenga Docker.
# Solo se necesita clonar el repositorio: Java va dentro de la imagen.
#
#   docker compose up -d api
#   docker compose --profile pruebas run --rm pruebas

name: isy1102-ev2

services:
  api:
    build:
      context: ./codigo/alumnos-api
      dockerfile: Dockerfile
      target: runtime
    image: alumnos-api:1.0.0
    ports:
      - "8080:8080"
    restart: unless-stopped

  pruebas:
    profiles: ["pruebas"]
    build:
      context: ./codigo/alumnos-api
      dockerfile: Dockerfile
      target: pruebas
    image: alumnos-api:pruebas
