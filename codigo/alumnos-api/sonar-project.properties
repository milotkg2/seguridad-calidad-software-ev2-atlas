# Identificacion del proyecto en SonarQube
sonar.projectKey=alumnos-api
sonar.projectName=API de Alumnos
sonar.projectVersion=1.0.0

# Codigo fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8

# Clases compiladas (necesarias para el analisis de Java)
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Reporte de cobertura generado por JaCoCo
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Excluir el arranque de Spring Boot (sin logica que analizar)
sonar.exclusions=**/AlumnosApplication.java
