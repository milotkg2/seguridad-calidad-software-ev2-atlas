# SonarQube Community (version web) + PostgreSQL
#
# Uso:
#   docker compose up -d
#   # esperar ~1-2 minutos y abrir http://localhost:9000  (usuario/clave: admin / admin)
#
# La primera vez que se ejecuta, SonarQube arranca en estado "starting";
# espera a que la pagina web responda antes de lanzar el analisis.
services:
  sonarqube:
    image: sonarqube:community
    platform: linux/amd64
    container_name: sonarqube
    depends_on:
      - db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  db:
    image: postgres:15
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
